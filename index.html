<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nura House — Privacy</title>
  <meta name="description" content="Privacy policies for apps created by Nura House.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fffaf0;
      color: #242424;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    .brand {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 28px;
      opacity: 0.65;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(40px, 8vw, 64px);
      font-weight: 500;
      line-height: 1;
      margin: 0 0 22px;
    }

    .intro {
      font-size: 18px;
      line-height: 1.7;
      color: #5b5b5b;
      margin-bottom: 42px;
      max-width: 580px;
    }

    .apps {
      display: grid;
      gap: 16px;
    }

    .card {
      display: block;
      padding: 24px 26px;
      border: 1px solid #ded8ce;
      border-radius: 18px;
      text-decoration: none;
      color: inherit;
      background: rgba(255, 255, 255, 0.55);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      background: #ffffff;
    }

    .card-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .card-description {
      color: #686868;
      line-height: 1.5;
      font-size: 15px;
    }

    footer {
      margin-top: 46px;
      padding-top: 22px;
      border-top: 1px solid #ded8ce;
      font-size: 14px;
      line-height: 1.8;
      color: #777;
    }

    footer a {
      color: inherit;
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="brand">Nura House</div>

    <h1>Privacy</h1>

    <p class="intro">
      Privacy information for apps created by Nura House.
      Choose an app below to view its privacy policy.
    </p>

    <div class="apps">

      <a class="card" href="pause-together.html">
        <div class="card-title">Pause Together</div>
        <div class="card-description">
          View the Privacy Policy for Pause Together.
        </div>
      </a>

      <a class="card" href="nudge.html">
        <div class="card-title">Nudge</div>
        <div class="card-description">
          View the Privacy Policy for Nudge.
        </div>
      </a>

    </div>

    <footer>
      © 2026 Nura House<br>
      Contact:
      <a href="mailto:nurahouseapps@gmail.comm">
        nurahouseapps@gmail.com
      </a>
    </footer>

  </main>
</body>
</html>
